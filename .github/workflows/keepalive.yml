name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes idle, so the
# first request after a quiet spell (e.g. logging in the next day) pays a
# 30-60s cold start. Pinging /health every ~10 minutes keeps it warm.
# Note: GitHub may delay scheduled runs under load, and disables schedules
# after 60 days with no repo activity. For stricter uptime, point an external
# monitor (e.g. UptimeRobot, 5-min interval) at the same URL.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -sS -m 40 https://ascend-backend-gt9i.onrender.com/health || true
