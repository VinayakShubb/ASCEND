name: Build Android APK

# Produces an installable, signed release APK as a downloadable artifact. Run
# it from the Actions tab (Run workflow), or by pushing a tag like "apk-v1".
#
# It is signed with one fixed keystore held in repo secrets, so every build
# installs as an update over the last one instead of being rejected for a
# mismatched signature. (A debug build is signed with a key the runner
# generates per run, which is why those could never update each other.)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ['apk-*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build web app against the production API
        run: npm run build
        env:
          VITE_API_URL: https://ascend-backend-gt9i.onrender.com

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (ANDROID_HOME set, licenses
      # accepted); Gradle downloads any missing build-tools itself.

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/ascend.keystore"

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ascend.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ascend-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # A public release gives a direct .apk link: no GitHub sign-in, no zip to
      # unpack on the phone. /releases/latest always points at the newest one.
      - name: Publish the APK as the latest release
        working-directory: frontend/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ascend-beta.apk"
          gh release create "build-${{ github.run_number }}" "$RUNNER_TEMP/ascend-beta.apk"             --repo "$GITHUB_REPOSITORY"             --title "ASCEND Beta 1.0.${{ github.run_number }}"             --notes "Tap **ascend-beta.apk** below to install or update. It installs over the previous version and keeps your login."             --latest
